<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2a3242"/>
      <stop offset="0.55" stop-color="#161b24"/>
      <stop offset="1" stop-color="#0c0f14"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0.15" y1="0.85" x2="0.7" y2="0.15">
      <stop offset="0" stop-color="#b9753f"/>
      <stop offset="0.55" stop-color="#d9a26b"/>
      <stop offset="1" stop-color="#f3d39a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- macOS icon body -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="420" fill="url(#sheen)"/>
    <!-- faint terminal grid -->
    <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="2">
      <path d="M100 260H924M100 420H924M100 580H924M100 740H924"/>
    </g>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3"/>

  <!-- the stroll: a winding trail -->
  <path d="M318 742 C 318 618, 712 650, 706 512 C 700 380, 318 410, 330 282"
        fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="78" stroke-linecap="round" transform="translate(0 8)"/>
  <path d="M318 742 C 318 618, 712 650, 706 512 C 700 380, 318 410, 330 282"
        fill="none" stroke="url(#trail)" stroke-width="70" stroke-linecap="round"/>
  <path d="M318 742 C 318 618, 712 650, 706 512 C 700 380, 318 410, 330 282"
        fill="none" stroke="#fff6e4" stroke-opacity="0.28" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 46"/>

  <!-- sessions along the way: working, needs you, your turn -->
  <g filter="url(#glow)">
    <circle cx="318" cy="742" r="50" fill="#121720"/>
    <circle cx="318" cy="742" r="34" fill="#3fb950"/>
    <circle cx="706" cy="512" r="50" fill="#121720"/>
    <circle cx="706" cy="512" r="34" fill="#e3a008"/>
    <circle cx="330" cy="282" r="50" fill="#121720"/>
    <circle cx="330" cy="282" r="34" fill="#58a6ff"/>
  </g>
</svg>
